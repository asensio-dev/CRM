name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # habilita también el job e2e (lento: se lanza a mano)

jobs:
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks revisa TODO el historial: git nunca olvida
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  verify:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_COLLATION: Modern_Spanish_CI_AS
          # Contraseña desechable del contenedor de CI, guardada en GitHub Actions secrets
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=AxiomCRM_CI;user=sa;password=${{ secrets.CI_MSSQL_SA_PASSWORD }};encrypt=true;trustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run arch
      - run: bun run secrets
      - name: Migraciones aplican desde cero
        working-directory: backend
        run: bunx prisma migrate deploy && bunx prisma migrate status
      - run: bun run test

  # Pruebas de integración del backend: AppModule real contra SQL Server. `test:db` recrea y siembra
  # la base AxiomCRM_Test (datos sintéticos) y genera contraseñas y secretos JWT aleatorios en el job.
  integration:
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_COLLATION: Modern_Spanish_CI_AS
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=AxiomCRM_Test;user=sa;password=${{ secrets.CI_MSSQL_SA_PASSWORD }};encrypt=true;trustServerCertificate=true
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - name: Migraciones + datos sintéticos + pruebas de integración
        run: bun run test:integration

  # E2E (Playwright + Chromium). Solo manual: Actions → CI → Run workflow.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_PID: Developer
          MSSQL_COLLATION: Modern_Spanish_CI_AS
          MSSQL_SA_PASSWORD: ${{ secrets.CI_MSSQL_SA_PASSWORD }}
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$MSSQL_SA_PASSWORD\" -Q 'SELECT 1'"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: sqlserver://localhost:1433;database=AxiomCRM_Test;user=sa;password=${{ secrets.CI_MSSQL_SA_PASSWORD }};encrypt=true;trustServerCertificate=true
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
